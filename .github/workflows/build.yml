name: Build & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96  # v4.4.1

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Run detekt
        run: ./gradlew detekt

      - name: Verify module graph is up to date
        run: |
          ./gradlew createModuleGraph
          git diff --exit-code docs/MODULE_GRAPH.md

      - name: Build Android
        run: ./gradlew androidApp:assembleDebug

      - name: Run tests (all modules)
        run: ./gradlew check

      - name: Coverage report
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-android
          path: '**/build/reports/tests/'

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-reports
          path: '**/build/reports/kover/'

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  # v4.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96  # v4.4.1

      - name: Build iOS framework
        run: ./gradlew shared:linkDebugFrameworkIosSimulatorArm64

      - name: Run tests
        run: ./gradlew shared:iosSimulatorArm64Test

      # CONFIGURE ME: uncomment once screenshot goldens are committed.
      # The iOS Roborazzi task is available now, but there are no baseline goldens yet,
      # so running it would fail on every PR until the first golden recording is committed.
      # - name: Verify screenshot goldens
      #   run: ./gradlew core:ui:verifyRoborazziIosSimulatorArm64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-ios
          path: '**/build/reports/tests/'
